name: Android APK

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: arm32
            task: assembleArm32Debug
            python: "3.11"
            artifact: ARMv7-32bit
          - flavor: arm64
            task: assembleArm64Debug
            python: "3.13"
            artifact: ARM64-64bit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up matching Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle -p android-app ${{ matrix.task }} --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp "android-app/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk" \
             "dist/DSH017-${{ matrix.artifact }}.apk"
          sha256sum dist/*.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DSH017-${{ matrix.artifact }}
          path: dist/DSH017-${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download both APK variants
        uses: actions/download-artifact@v4
        with:
          pattern: DSH017-*
          merge-multiple: true
          path: dist

      - name: Verify release files and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/DSH017-ARMv7-32bit.apk
          test -s dist/DSH017-ARM64-64bit.apk
          (cd dist && sha256sum DSH017-ARMv7-32bit.apk DSH017-ARM64-64bit.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH017 Android ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            DSH017 standalone Android WebView app (${{ github.ref_name }}).

            - Android 8.1+ (API 27).
            - Install the ARM64 APK on 64-bit ARM devices.
            - Install the ARMv7 APK on 32-bit ARM devices.
            - Configure your own Zhipu API key in the app. No provider key is bundled.
            - The embedded services bind to loopback; SQLite and chat history stay in app-private storage.

            See [Android installation notes](https://github.com/2719126468-ship-it/dsh017/blob/main/android-app/README.md).
          files: |
            dist/DSH017-ARMv7-32bit.apk
            dist/DSH017-ARM64-64bit.apk
            dist/SHA256SUMS.txt
