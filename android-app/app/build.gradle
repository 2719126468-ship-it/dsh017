plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

// Release signing is deliberately separate from CI debug signing. A release
// task must have a persistent keystore supplied by protected CI secrets.
def releaseStorePath = System.getenv("DSH017_ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("DSH017_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("DSH017_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("DSH017_ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseStorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() } &&
    new File(releaseStorePath ?: "").isFile()
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (releaseBuildRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Release APK signing is not configured. Supply the persistent DSH017 Android signing secrets; refusing to use a temporary debug key."
    )
}

android {
    namespace "com.dsh017.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.dsh017.android"
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName "0.1.2"
    }

    flavorDimensions "abi"
    productFlavors {
        arm32 {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
        arm64 {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

chaquopy {
    productFlavors {
        arm32 {
            version = "3.11"
            buildPython("python3.11")
            pip {
                install("Flask==3.1.2")
                install("waitress==3.0.2")
                install("requests==2.32.5")
            }
        }
        arm64 {
            version = "3.13"
            buildPython("python3.13")
            pip {
                options("--extra-index-url", "https://pypi.flet.dev")
                install("Flask==3.1.2")
                install("waitress==3.0.2")
                install("requests==2.32.5")
                install("curl_cffi==0.16.2")
            }
        }
    }
    sourceSets {
        main {
            srcDir("$buildDir/generated/dshPython")
        }
    }
}

tasks.register("stageDshPython", Copy) {
    from(rootProject.file("../app")) { into("app") }
    from(rootProject.file("../bili_console.py"))
    from(rootProject.file("../hub_server.py"))
    from(rootProject.file("../novel_server.py"))
    from(rootProject.file("../tarot_server.py"))
    from(rootProject.file("../scripts/data_backup.py"))
    into("$buildDir/generated/dshPython")
}
// Chaquopy creates variant-specific merge*PythonSources tasks. They consume
// the staged directory, so declare the producer dependency explicitly.
tasks.configureEach { task ->
    if (task.name.endsWith("PythonSources")) {
        task.dependsOn("stageDshPython")
    }
}
tasks.named("preBuild").configure {
    dependsOn("stageDshPython")
}
